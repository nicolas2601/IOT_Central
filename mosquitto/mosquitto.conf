# Configuración de Mosquitto MQTT Broker
# Plataforma IoT - Proyecto Final

# Listener para conexiones MQTT estándar
listener 1883
protocol mqtt
allow_anonymous true

# Listener para conexiones WebSocket
listener 9001
protocol websockets
allow_anonymous true

# Configuración de persistencia
persistence true
persistence_location /mosquitto/data/

# Configuración de logs
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Timestamp en logs
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Configuración de conexión
max_connections -1
max_keepalive 65535
